hemes.订单准确.counts.送错菜品", "subthemes.订单准确.counts.备注未执行", "subthemes.订单准确.multi"], "audit1": {"verdict": "部分支持", "issues": ["数字不符", "忽略反例"]}, "audit2": {"verdict": "支持", "resolved": "已解决", "issues": ["重叠问题已解决：正文加了“有 1 条同时属于两类”，10+10+9+7=36 与 35 条的差额得到解释。数字与 facts.json 一致。", "仍有一条未计入的下限问题：W161“万幸的是没给我餐具啊”（反讽，保守口径，未标订单准确）。35 是下限，但差距很小，不影响判定。"]}}, {"id": "T07", "layer": "行动", "type": "建议", "text": "漏送、缺配套物品和备注未执行，有可能通过出餐前的核对减少；送错菜品也可能发生在骑手交接环节，需要分开排查。", "quotes": [], "evidence": [["W003", "少给我个爽口菜。打电话一直占线。今天给你扣5元，爽口菜钱"], ["W146", "都说了不要辣的,还给我来个辣的"], ["W135", "点的肘子卷送的土豆卷，打电话说再送过来也没送。"]], "subthemes": [], "verify": "", "owner": "门店运营与出餐岗", "action": "出餐前按订单核对菜品数量、配套物品和备注；备注在小票上醒目标出；餐具吸管设为默认配套；对送错的订单追查是出餐还是交接环节出错", "metric": "每百单订单准确类差评数、备注未执行投诉数占订单的比例", "refs": [], "audit1": {"verdict": "部分支持", "issues": ["类型不当", "证据不足", "其他"]}, "audit2": {"verdict": "支持", "resolved": "已解决", "issues": ["上一轮的类型和证据问题已解决：原来“都发生在出餐打包环节”的断言改成“有可能通过出餐前核对减少”，并把送错菜品单列为可能出在交接环节；证据换成对应各类的 W003（漏送）、W146（备注）、W135（送错）；指标改为每百单的比率；负责方加上出餐岗。", "小问题：“备注未执行”有可能出在制作环节（W240 的“别放姜”、W166 的“不要香菜和辣”是菜里已经放了，核对小票未必能在出餐时发现），措施里“备注在小票上醒目标出”只覆盖一部分。发票（W025、W062）已从正文中拿掉，但 action 里没有提发票，是一致的。"]}}, {"id": "T08", "layer": "描述", "type": "观察", "text": "卫生与安全问题共 14 条，约占样本的 5%。编码手册要求必须有明确描述才标这一项，所以这是下限。其中异物与不洁 7 条，变质或异味 5 条，没有做熟 2 条，吃后不适 1 条，有 1 条同时属于两类。这类问题一旦属实后果严重，但各条的程度差别很大，从蟑螂、塑料碎片到有股药味都有。", "quotes": [["W261", "有1公分长的蟑螂"], ["W297", "有股药味儿"], ["W274", "肉有几片没炒熟"]], "evidence": [["W261", "你们店赶紧关门整顿吧！有1公分长的蟑螂，真是对你们店无语！要不传照片上去看看！"], ["W213", "今天这顿午餐吃得着实不爽，10点多订餐，要求12点到，结果迟到了40多分钟，1点就上班，还有时间吃饭吗？配送员竟然和我抱怨说这边太远了，这个理由太扯了吧。好吧，就不说菜汤都流的到处都是了，着急赶快吃完上班，一口菜进嘴里，一个比鱼刺还大还坚硬的塑料碎片卡在嗓子眼，估计是你们塑料勺碎了吧？怎么还掺在菜里面？幸好我及时取出，现在嗓子眼还疼着，物证还保留着。这种卫生，着实醉了。"], ["W297", "汉堡非常小，鸡块超难吃，有股药味儿!"], ["W274", "连续吃了两回了，味道不错，菜量小。不太够吃，最重要的问题是今天的干锅茶树菇里面的肉有几片没炒熟……下回请厨师大人一定要炒熟啊！"]], "subthemes": [["卫生与安全", "异物与不洁"], ["卫生与安全", "变质或异味"], ["卫生与安全", "没有做熟"], ["卫生与安全", "吃后不适"]], "verify": "", "owner": "", "action": "", "metric": "", "refs": ["aspects.卫生与安全.neg", "aspects.卫生与安全.  也不再被当作满意度。", "小问题：正文没说明“其中多条温和意见”大约有多少条（我数到至少十几条“一般/偏咸/偏淡”）；“不少”可以接受。样本比例的局限应由开头栏目覆盖。"]}}, {"id": "T11", "layer": "解释", "type": "观察", "text": "有一个问题分散在多个方面里：商家或客服联系不上、投诉没人处理。仅在商家服务的负面评价中，属于这一类的就有 11 条；在漏送和配送超时的评论里也有类似描述，没有计入这个数字。另有订单处理不当 6 条，如擅自完成订单、截单、缺货很久才告知。", "quotes": [["W136", "送错了，投诉完没人理"], ["W063", "送餐员说稍后给打电话解决，可是也没联系我"], ["W266", "给我截单了"]], "evidence": [["W077", "快被饿死了，真的很不愉快的经历，商家电话一直也打不通"], ["W136", "送错了，投诉完没人理，要的鸡柳的送的最便宜的"], ["W286", "给我配错了，中午的饭，等到晚上才给我解决，中间打了4次电话投诉都无效，差"], ["W063", "再也不要点这家店了。。点的粥没有送到，但是把钱拿走了，送餐员说稍后给打电话解决，可是也没联系我，电话也不接。。。必须差评"], ["W196", "10点下单，12点还不到，打电话催了5次，说是送丢了，最后下午1点送到的"], ["W266", "外卖在哪呢！特么人间蒸发啦！太差了吧！等了一个小时没送到给我截单了！"]], "subthemes": [["商家服务", "联系不上或投诉无人处理"], ["商家服务", "订单处理不当"]], "verify": "", "owner": "", "action": "", "metric": "", "refs": ["subthemes.商家服务.counts.联系不上或投诉无人处理", "subthemes.商家服务.counts.订单处理不当"], "audit1": null, "audit2": {"verdict": "部分支持", "resolved": "新结论", "issues": ["开头写“有一个问题分散在多个方面里”，但数字只统计了商家服务这一个方面内的 11 条，没有统计分散在其他方面里的同类评论。我找到未计入的：W063（电话也不接，标为订单准确和骑手服务）、W090（连个电话也没有，配送时效和骑手服务）、W196（打电话催了 5 次，送丢了）、W220（打了 n 个电话才找到）、W104（催了仍旧晚到）。所以 11 是商家服务口径下的数，不是这个问题的全貌；“分散”的说法需要以数字支持，或者收窄表述。", "“常常和漏送、送错或配送超时同时出现”没有给数字，我核对：11 条中有 10 条同时有订单准确或配送时效的负面（W077 只有联系不上）。应写成“11 条中 10 条”。另外“另有订单处理不当 6 条”与前一类有 1 条重叠（W004），正文没有像 T06、T08 那样说明；商家服务 19 条中还有 3 条“态度差或推脱”（W054、W034、W099）没有提到，11+6 不等于 19。", "归类有些宽：W120“没有任何回复”没有说明联系对象，也可能是没有收到延误通知；W135“打电话说再送过来也没送”是承诺没兑现，不是联系不上；W286 联系上了但无效。它们可以算“投诉没处理”，但与“电话打不通”性质不同，应合并描述为“联系不上或投诉没有结果”。W266“给我截单了”不能确定是商家还是平台所为，归入“商家订单处理不当”是解读。", "没有说明基数：11 条约占样本的 3.7%，占商家服务负面的 58%；评论无法区分是商家、客服还是平台，也是多年前电话主导的时代的数据。"]}}, {"id": "T12", "layer": "行动", "type": "建议", "text": "可以试点把投诉和催单的响应情况当作服务质量指标来管理。联系不上可能会把一次失误放大成更强烈的不满，但这一点尚未验证，需要通过对照比较确认。", "quotes": [], "evidence": [["W077", "快被饿死了，真的很不愉快的经历，商家电话一直也打不通"], ["W234", "坑！等了两个小时！催单三次，打电话过去N次，一直通话中！都没法取消！我都不想骂人了"]], "subthemes": [], "verify": "", "owner": "商家运营与平台客服", "action": "为投诉设定处理时限并告知进度；商家联系不上时提供平台介入入口；试点商家与对照商家比较", "metric": "投诉在规定时限内得到回复的比例、问题订单中最终给出差评的比例（试点组与对照组对比）", "refs": [], "audit1": null, "audit2": {"verdict": "部分支持", "resolved": "新结论", "issues": ["“用户出了问题联系不上，会把一次失误放大成强烈不满”是以确定语气写的因果机制，但数据里没有这个比较：我们看不到“联系上了”的用户反应，也无法区分是联系不上让人更生气，还是生气的人才会写评论说联系不上（10 条同时有其他失误）。这实际上就是 T04 的未验证假设，应写成“可能”并链接 T04 的 verify。", "证据 W077、W234 都是最激烈的案例（“快被饿死了”“我都不想骂人了”），W077 甚至没有描述发生了什么问题；整体只有 11 条，约占样本 4%，没有说明为什么这比其他问题更值得作为服务质量指标。", "评论来自“百度外卖”时期，以电话为主要渠道；现在的商家与客服沟通多在应用内，“电话接通率”可能已不是合适的指标，建议用“联系入口的响应时长”表述。", "与 T05 的“催单后规定时间内得到回复的比例”重叠，应说明二者的关系；建议同时设置“无法联系的订单差评率与可联系订单对比”以验证。"]}}, {"id": "T13", "layer": "描述", "type": "观察", "text": "其他值得留意的负面方面：分量 23 条，包装 21 条（多为洒漏），商家服务 19 条。另有 21 条评论没有标出具体方面，主要是只表达态度的短评，也有个别信息不足以归类的评论。各结论之间存在重复计数：同一条评论可能同时出现在配送、订单准确和商家服务的统计里。", "quotes": [["W230", "到的时候粥洒了一半"], ["W046", "菜太少了吧"]], "evidence": [["W046", "菜太少了吧"], ["W230", "送的太慢了,等了近两个小时。。。到的时候粥洒了一半"], ["W042", "第一次使用就成这样，所有咖啡撒的到处都是！"]], "subthemes": [], "verify": "", "owner": "", "action": "", "metric": "", "refs": ["aspects.分量.neg", "aspects.包装.neg", "aspects.商家服务.neg", "no_aspect_valid"], "audit1": null, "audit2": {"verdict": "部分支持", "resolved": "新结论", "issues": ["“22 条评论只表达了态度，没有提到具体方面，例如只说很好或太差”不完全准确：这 22 条是编码规则下没有方面标签的评论，其中至少有几条带有内容：W055“你送的这是披萨吗？拖成一坨”（温度与口感）、W017“微波炉又热了一遍…”（暗示变凉）、W116“希望能按时送到就更好了”（配送建议）、W237“浪费了我的5元优惠券”（价格或优惠）、W246“口味偏北方”、W088“没有期待中的感觉”。因此更准确的说法是“没有被编码手册归入具体方面”，而不是“只表达态度”。同时这 22 条的总情感被记为中性，实际上有明显的好评（W038、W056、W123）和差评（W119、W288），读者可能误以为是中性评论。", "选择标准没有说明：T13 把分量、包装、商家服务称为“其他值得留意的负面方面”，但没有说明为什么是这三个；温度与口感（33 条）在 T03、骑手服务（17 条负面）在 T10 已经提到，价格 5 条、描述相符 4 条未提。商家服务 19 条与 T11 重复。分量的严重度在编码手册里是“低”，却被列为“值得留意”，没有解释。", "没有说明这 22 条会拉低各方面的比例，也没有提醒这些方面计数是下限。"]}}, {"id": "T14", "layer": "行动", "type": "推断", "text": "口味（负面 58 条）和温度与口感（负面 33 条）的问题虽然不少，但本报告不提具体改进建议：数据没有店铺编号，口味问题分散在不同店铺和菜品，无法定位；温度问题与配送、包装都有关，需要先按门店和配送方式拆开数据再判断。", "quotes": [["W171", "肉煎得太老了"], ["W015", "粥有点凉了"]], "evidence": [["W198", "太难吃了,海藻巨腥"], ["W171", "肉煎得太老了，芹菜没入味，就剩点辣椒还能吃。新换的厨师真心不怎么着。"], ["W015", "饼不错,粥有点凉了,送餐最快的一次~"]], "subthemes": [], "verify": "", "owner": "", "action" function rounded(x,y,w,h,r){ r=Math.min(r,w,h/2); return `M${x},${y}H${x+w-r}A${r},${r} 0 0 1 ${x+w},${y+r}V${y+h-r}A${r},${r} 0 0 1 ${x+w-r},${y+h}H${x}Z`; }
function tipFor(box){ const t=el("div","tip"); box.append(t); return (txt, x, y)=>{ if(txt==null){ t.style.opacity=0; return; } t.textContent=txt; t.style.left=x+"px"; t.style.top=y+"px"; t.style.opacity=1; }; }

function barChart(box, rows, opts){
  const W=Math.min(620, Math.max(280, Math.round(box.clientWidth-34))), labelW=opts.labelW||104, rowH=28, barH=14, top=4, H=top+rows.length*rowH+6;
  const max=Math.max(...rows.map(r=>r.v),1); const plotW=W-labelW-(rows.some(r=>r.tag)?96:44);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img","aria-label":opts.aria});
  const tip=tipFor(box);
  rows.forEach((r,i)=>{
    const y=top+i*rowH; const w=Math.max(2, r.v/max*plotW);
    svg.append(sv("text",{x:labelW-8,y:y+barH/2+5,"text-anchor":"end","font-size":12,fill:"var(--ink2)"},r.label));
    const p=sv("path",{d:rounded(labelW,y+2,w,barH,4),fill:r.color||"var(--s1)"}); svg.append(p);
    svg.append(sv("text",{x:labelW+w+6,y:y+barH/2+6,"font-size":12,fill:"var(--ink)","font-weight":600},String(r.v)+(r.tag?"  "+r.tag:"")));
    const hit=sv("rect",{x:0,y:y,width:W,height:rowH,fill:"transparent"});
    hit.addEventListener("mousemove",e=>{ const b=box.getBoundingClientRect(); tip(r.tipText||`${r.label}：${r.v}`, e.clientX-b.left, e.clientY-b.top); });
    hit.addEventListener("mouseleave",()=>tip(null)); svg.append(hit);
  });
  svg.append(sv("line",{x1:labelW,x2:labelW,y1:0,y2:H-4,stroke:"var(--axis)","stroke-width":1}));
  box.append(svg);
}

function groupedChart(box, cmp){
  const W=Math.max(280, Math.round(box.clientWidth-34)), labelW=112, barH=11, gap=3, groupH=2*barH+gap+14, top=4, H=top+cmp.rows.length*groupH;
  const max=Math.max(...cmp.rows.flatMap(r=>r.values),1); const plotW=W-labelW-36;
  const cols=["var(--s1)","var(--s2)"];
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img","aria-label":"两组评论对比"}); const tip=tipFor(box);
  cmp.rows.forEach((r,i)=>{
    const y0=top+i*groupH;
    svg.append(sv("text",{x:labelW-8,y:y0+barH+4,"text-anchor":"end","font-size":12,fill:"var(--ink2)"},r.label));
    r.values.forEach((v,j)=>{
      const y=y0+j*(barH+gap); const w=Math.max(2,v/max*plotW);
      svg.append(sv("path",{d:rounded(labelW,y,w,barH,4),fill:cols[j]}));
      svg.append(sv("text",{x:labelW+w+6,y:y+barH-1,"font-size":11.5,fill:"var(--ink)","font-weight":600},String(v)));

      hit.addEventListener("mouseleave",()=>tip(null)); svg.append(hit);
    });

  svg.append(sv("line",{x1:labelW,x2:labelW,y1:0,y2:H-6,stroke:"var(--axis)","stroke-width":1}));

  const lg=el("div","legend"); cmp.series.forEach((s,j)=>{ const sp=el("span"); const i=el("i"); i.style.background=cols[j]; sp.append(i, document.createTextNode(s)); lg.append(sp); }); box.append(lg);
}

  const head=el("div","chead"); head.append(el("span","cid",c.id), el("span","chip "+c.type,c.type));
  if(c.audit2) head.append(el("span","verdict","审稿："+c.audit2.verdict)); card.append(head, el("p","ctext",c.text));
  if(c.type==="假设"&&c.verify){ const dl=el("dl","kv"); dl.append(el("dt",null,"验证方法"),el("dd",null,c.verify)); card.append(dl); }
  if(c.type==="建议"){ const dl=el("dl","kv"); [["负责团队",c.owner],["具体动作",c.action],["衡量指标",c.metric]].forEach(([k,v])=>dl.append(el("dt",null,k),el("dd",null,v))); card.append(dl); }
  const ev=el("details"); ev.append(el("summary",null,"依据")); const box=el("div","ev");
  c.quotes.forEach(([id,q])=>{ const p=el("div","q"); p.append(el("span","qid",id), document.createTextNode("“"+q+"”")); box.append(p); });
  if(c.refs.length) box.append(el("div","refs","数字来源："+c.refs.join("，")));
  const fl=el("details"); fl.append(el("summary",null,`证据评论原文（${c.evidence.length} 条）`)); const fb=el("div","ev");
  c.evidence.forEach(([id,t])=>{ const p=el("div","q"); p.append(el("span","qid",id), document.createTextNode(t)); fb.append(p); }); fl.append(fb); box.append(fl);
  if(c.audit1||c.audit2){ const a=el("div","audit");
    if(c.audit1) a.append(el("div",null,`第一轮审稿：${c.audit1.verdict}${c.audit1.issues.length?"（指出："+[...new Set(c.audit1.issues)].join("、")+"）":""}`));
    if(c.audit2){ a.append(el("div",null,`第二轮审稿：${c.audit2.verdict}${c.audit2.resolved?"，"+c.audit2.resolved:""}`)); c.audit2.issues.forEach(t=>a.append(el("div",null,"· "+t))); }
    box.append(a); }
  ev.append(box); card.append(ev);
  return card;
}

function goClaim(id){
  const all=$("#allClaims"); if(all) all.open=true;
  const t=document.getElementById("c-"+id); if(!t) return;
  t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"center"});
  t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1600);
}

function render(){
  $("#tabs").replaceChildren(...DATA.sets.map(s=>{ const b=el("button","tab",s.name); b.type="button"; b.setAttribute("aria-pressed",s.key===active?"true":"false"); b.addEventListener("click",()=>{active=s.key; render();}); return b; }));
  const set=DATA.sets.find(s=>s.key===active); const body=$("#body"); body.replaceChildren();
  const hero=el("section","hero"); hero.append(el("div","ds",set.name), el("h1",null,set.headline));
  const reviewed=set.claims.filter(c=>decisions[c.id]).length;
  hero.append(el("div","meta",`基于 ${set.n} 条评论 · 双 AI 标注，已并入部分人工裁决 · ${set.claims.length} 条结论，可展开证据与已有审稿记录`));
  body.append(hero);

  const dir=el("section","dir"); dir.append(el("div","lab","建议方向"), el("p","d",set.direction));
  const road=el("div","road");
  [["马上做",""],["先验证再推广","v"],["先补数据","dt"]].forEach(([col,cls])=>{
    const items=set.roadmap[col]||[]; if(!items.length) return;
    const c=el("div","col "+cls); c.append(el("h3",null,col));
    items.forEach(it=>{ const d=el("div","item"); d.append(el("b",null,it.text), el("span",null,it.why)); const lk=el("button","cardlink","依据 →"); lk.type="button"; lk.addEventListener("click",()=>goClaim(it.claim)); d.append(lk); c.append(d); });
    road.append(c);
  });
  dir.append(road, el("p","rule","排序依据：高严重度优先；严重程度相同时看条数；依赖未验证假设的先验证；缺少关键数据的先补数据。"));
  body.append(dir);

  body.append(el("h2","part","为什么这样建议：四个发现"));
  const cards=el("div","cards");
  set.cards.forEach(c=>{
    const k=el("article","card"); k.append(el("h3",null,c.title));
    const kp=el("div","kpi"); kp.append(el("b",null,c.kpi), el("span",null,c.kpi_label)); k.append(kp);
    if(c.detail) k.append(el("p","detail",c.detail));
    const q=el("p","quote"); q.append(document.createTextNode("“"+c.quote[1]+"”"), el("small",null,c.quote[0])); k.append(q);
    k.append(el("p","act",c.action));
    const lk=el("button","cardlink","查看依据和审稿记录 →"); lk.type="button"; lk.addEventListener("click",()=>goClaim(c.claim)); k.append(lk);
    cards.append(k);
  });
  body.append(cards);

  body.append(el("h2","part","数据一览"));
  const charts=el("div","charts"); body.append(charts);
  const draws=[];
  const c1=chartBox("用户在抱怨什么", "各方面的负面提及条数，从多到少；红色为涉及资金、安全或核心功能失效的高严重度问题");
  charts.append(c1);
  draws.push(()=>barChart(c1, [...set.rank].sort((a,b)=>b.neg-a.neg).map(r=>({label:r.aspect, v:r.neg, color:r.sev==="高"?"var(--critical)":"var(--s1)", tag:r.sev==="高"?"高严重度":"", tipText:`${r.aspect}：${r.neg} 条负面，严重程度${r.sev}`})), {aria:"各方面负面提及条数"}));
  const lg=el("div","legend"); [["var(--s1)","中、低严重度"],["var(--critical)","高严重度"]].forEach(([col,t])=>{ const s=el("span"); const i=el("i"); i.style.background=col; s.append(i, document.createTextNode(t)); lg.append(s); }); draws.push(()=>c1.append(lg));
  if(set.compare){
    const c2=chartBox("两组评论像两个阶段的产品","同一个 App，近期评论与早年高赞评论的对比（条数）"); charts.append(c2); draws.push(()=>groupedChart(c2, set.compare));
  }
  const c3=chartBox(set.subs.aspect+"：具体是哪种情况", "一条评论可能属于多类，各类相加会超过总数");
  charts.append(c3);
  draws.push(()=>barChart(c3, set.subs.items.map(s=>({label:s.name, v:s.count, color:s.muted?"var(--muted-bar)":"var(--s1)"})), {aria:set.subs.aspect+"细分", labelW:140}));
  draws.forEach(f=>f());

  const rs=el("section","research"); rs.append(el("h3",null,"下一步要研究的问题")); const ol=el("ol"); set.research.forEach(q=>ol.append(el("li",null,q))); rs.append(ol); body.append(rs);

  const lim=el("details","limits"); lim.append(el("summary",null,"样本与局限：结论只代表这批样本，原因均为待验证的假设")); const ul=el("ul"); set.limits.forEach(t=>ul.append(el("li",null,t))); lim.append(ul); body.append(lim);

  const all=el("details","all"); all.id="allClaims";
  all.append(el("summary",null,`全部结论与依据（${set.claims.length} 条，可展开依据）`));
  const lg2=el("div","legend2"); [["观察","数据直接显示"],["推断","对数据的解读"],["假设","关于原因的猜测，需要验证"],["建议","行动方案"]].forEach(([t,d])=>{ const s=el("span"); s.append(el("span","chip "+t,t), document.createTextNode(" "+d)); lg2.append(s); }); all.append(lg2);
  LAYERS.forEach(([L,desc])=>{ const cs=set.claims.filter(c=>c.layer===L); if(!cs.length) return; all.append(el("h4","sec",`${L}：${desc}`)); const list=el("div","list"); cs.forEach(c=>list.append(claimCard(c))); all.append(list); });
  body.append(all);
}

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const open=$("#allClaims")?.open; render(); if(open) $("#allClaims").open=true; },200); });
render();
</script>

</body></html>

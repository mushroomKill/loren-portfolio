<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <meta name="description" content="个人作品集：首页果冻背景、视差和水波揭幕预览。">
  <title>个人作品集</title>
  <style>
:root {
  color-scheme: light;
  --page-bg: #f4efe5;
  --ink: #383b33;
  --muted: #686b5e;
  --amber: #a0713e;
  --sage: #75816b;
  --portrait-size: min(76svh, 700px, 82vw);
  --portrait-top: clamp(92px, 12svh, 126px);
}
* { box-sizing: border-box; }
html { background: var(--page-bg); }
body { margin: 0; color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid #806333; outline-offset: 8px; border-radius: 2px; }
.page { position: relative; isolation: isolate; min-height: max(740px, 100svh, calc(var(--portrait-top) + var(--portrait-size) * .79 + 240px)); overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #fffaf1 0, transparent 54%), var(--page-bg); }
.page::after { content: ""; pointer-events: none; position: absolute; z-index: 6; inset: 0; opacity: .028; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.65' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
.site-header { position: relative; z-index: 8; display: flex; align-items: center; justify-content: space-between; height: 94px; margin: 0 4%; border-bottom: 1px solid #797e6529; }
.wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 29px; letter-spacing: -1.4px; }
.wordmark span { display: inline-block; margin-left: 9px; font-family: sans-serif; color: #89652f; font-size: 25px; vertical-align: 1px; }
nav { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 36px; font-size: 13px; letter-spacing: .13em; }
nav .active { position: relative; }
nav .active::after { content: ""; position: absolute; bottom: -12px; left: 50%; width: 3px; height: 3px; border-radius: 50%; background: #89652f; }
nav [aria-disabled] { color: #7c8074; cursor: default; }
.header-note { color: var(--muted); font-size: 10px; letter-spacing: .2em; }
.hero { position: static; }
.ambient { position: absolute; inset: 0; pointer-events: none; }
.resin { position: absolute; left: 50%; top: calc(var(--portrait-top) + var(--portrait-size) * .06); width: calc(var(--portrait-size) * 1.17); height: calc(var(--portrait-size) * .87); }
.resin-amber { transform: translateX(-53%) rotate(-16deg); border-radius: 43% 57% 63% 37% / 52% 49% 51% 48%; background: radial-gradient(ellipse at 22% 15%, #ba945b65, transparent 51%), radial-gradient(ellipse at 88% 75%, #b27d4169, transparent 51%), linear-gradient(145deg, #705638, #514e3655 60%, #685538); box-shadow: inset 1px 2px 3px #dac08a50, inset -7px -8px 25px #322b2270, 0 22px 70px #10141050; }
.resin-sage { width: calc(var(--portrait-size) * .81); height: calc(var(--portrait-size) * .87); transform: translateX(-20%) rotate(23deg); border-radius: 61% 39% 48% 52% / 40% 48% 52% 60%; background: radial-gradient(ellipse at 80% 22%, #a3ac8650, transparent 68%), linear-gradient(125deg, #4d59405c, #66755b9e); box-shadow: inset -1px 2px 3px #b5c09b50; }
.portrait-scene { position: absolute; z-index: 2; width: var(--portrait-size); height: var(--portrait-size); top: var(--portrait-top); left: 50%; transform: translateX(-50%); }
.portrait { display: block; width: 100%; height: 100%; object-fit: contain; mask-image: linear-gradient(#000 0%, #000 79%, #000b 88%, transparent 100%); }
.hero-copy { position: absolute; z-index: 4; top: calc(var(--portrait-top) + var(--portrait-size) * .79); left: 50%; transform: translateX(-50%); width: min(94%, 900px); text-align: center; }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(76px, 8.4vw, 120px); line-height: 1.06; letter-spacing: -.065em; text-shadow: none; white-space: nowrap; }
h1 .greeting { font-size: .73em; letter-spacing: -.055em; }
h1 em { font-weight: 400; color: #e1ba83; }
.intro { font-size: 14px; letter-spacing: .06em; line-height: 1.85; margin: 19px auto 0; max-width: 510px; color: #545d49; }
.intro.is-placeholder { font-size: 12px; color: #707760; letter-spacing: .24em; }
.copy-rule { display: block; height: 29px; width: 1px; margin: 18px auto 0; background: linear-gradient(#afad8d90, transparent); }
.side-label { position: absolute; left: 4%; top: 49%; margin: 0; color: #757c6a; font-size: 10px; letter-spacing: .23em; writing-mode: vertical-rl; transform: rotate(180deg); }
.orbit { position: absolute; width: min(90vw, 1050px); height: auto; left: 50%; top: calc(var(--portrait-top) - 35px); transform: translateX(-50%) rotate(-9deg); stroke: #a5a589; stroke-width: .7; opacity: .3; }
.spark { position: absolute; width: 39px; height: 39px; stroke: #c3ad7b; stroke-width: 1.1; }
.spark-one { left: calc(50% - var(--portrait-size) * .68); top: calc(var(--portrait-top) + var(--portrait-size) * .33); transform: rotate(12deg); }
.spark-two { left: calc(50% + var(--portrait-size) * .62); top: calc(var(--portrait-top) + var(--portrait-size) * .62); width: 21px; height: 21px; stroke: #a0b293; }
.tiny-dot { position: absolute; left: calc(50% + var(--portrait-size) * .67); top: calc(var(--portrait-top) + var(--portrait-size) * .3); width: 4px; height: 4px; border-radius: 50%; background: #c2a573; }
.site-footer { position: absolute; z-index: 7; bottom: 25px; left: 4%; right: 4%; display: flex; align-items: center; justify-content: space-between; color: #68715d; font-size: 10px; letter-spacing: .12em; }
.page-index { display: flex; align-items: center; gap: 13px; }
.page-index b { color: #4c5645; font-weight: 400; }
.footer-rule { width: 36px; height: 1px; background: #888c7470; }
.preview-label { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .1em; }
.preview-label i { width: 4px; height: 4px; border-radius: 50%; background: #a9b397; }
.footer-signature { font-size: 9px; letter-spacing: .2em; }
@media (max-height: 800px) and (min-width: 701px) {
  :root { --portrait-size: min(72svh, 620px, 75vw); --portrait-top: 94px; }
  .page { min-height: max(670px, 100svh, calc(var(--portrait-top) + var(--portrait-size) * .79 + 225px)); }
  h1 { font-size: 98px; }
  .intro { margin-top: 12px; }
}
@media (max-width: 700px) {
  :root { --portrait-size: min(108vw, 590px); --portrait-top: clamp(122px, 19svh, 165px); }
  .page { min-height: max(730px, 100svh, calc(var(--portrait-top) + var(--portrait-size) * .83 + 210px)); }
  .site-header { height: 80px; margin: 0 6%; }
  .wordmark { font-size: 26px; }
  .wordmark span { font-size: 21px; margin-left: 6px; }
  nav { position: static; transform: none; gap: 21px; font-size: 12px; }
  .header-note { display: none; }
  .portrait-scene { max-width: none; }
  .resin { width: calc(var(--portrait-size) * .96); height: calc(var(--portrait-size) * .91); }
  .resin-sage { width: calc(var(--portrait-size) * .74); transform: translateX(-25%) rotate(23deg); }
  h1 { font-size: clamp(59px, 15.8vw, 100px); }
  .hero-copy { top: calc(var(--portrait-top) + var(--portrait-size) * .83); }
  .intro.is-placeholder { font-size: 11px; margin-top: 17px; }
  .side-label { writing-mode: horizontal-tb; transform: none; top: 110px; left: 6%; font-size: 8px; letter-spacing: .19em; }
  .spark-one { left: 7%; top: calc(var(--portrait-top) + 18px); width: 24px; height: 24px; }
  .spark-two { left: auto; right: 7%; top: calc(var(--portrait-top) + var(--portrait-size) * .54); width: 16px; }
  .tiny-dot { display: none; }
  .orbit { width: 135vw; top: calc(var(--portrait-top) - 10px); opacity: .22; }
  .site-footer { left: 6%; right: 6%; bottom: 24px; }
  .footer-signature { display: none; }
  .preview-label { position: static; transform: none; }
}
@media (max-width: 360px) {
  nav { gap: 15px; }
  .wordmark { font-size: 23px; }
}

/* Stage 02: portrait and all face layers share one transform. */
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #806333; outline-offset: 5px; }
[hidden] { display: none !important; }
.wordmark span { margin: 0; font-size: 32px; }
.page { --project-accent: #795d2e; min-height: max(780px, 100svh); }
.site-header { background: linear-gradient(var(--page-bg), #f4efe500); }
.portrait-rig { position: relative; width: 100%; height: 100%; transform-origin: 0 0; transition: transform 850ms cubic-bezier(.22,.75,.2,1); }
.eye-layer, .sticker-hotspots { position: absolute; inset: 0; width: 100%; height: 100%; }
.sticker-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.eye-layer { visibility: hidden; pointer-events: none; }
.eye-layer.is-tracking { visibility: visible; }
.sticker { position: absolute; transform: translate(-50%, -50%); padding: 0; border: 1px solid transparent; background: transparent; cursor: pointer; border-radius: 32%; width: 7.4%; height: 7.2%; min-width: 30px; min-height: 30px; -webkit-tap-highlight-color: transparent; }
.sticker::after { content: ''; position: absolute; inset: -3px; border-radius: inherit; border: 1px solid #f1ddb400; transition: border-color 160ms, box-shadow 160ms; }
.sticker:hover::after, .sticker:focus-visible::after, .sticker[aria-pressed="true"]::after { border-color: #8b6939bb; box-shadow: 0 0 10px #b59a5c24; }
.reviews { left: 39.6%; top: 44%; width: 7%; height: 5.8%; transform: translate(-50%, -50%) rotate(6deg); }
.game { left: 40.5%; top: 50.5%; transform: translate(-50%, -50%) rotate(14deg); }
.heart { left: 62.5%; top: 42.8%; width: 5.6%; height: 5.8%; transform: translate(-50%, -50%) rotate(16deg); }
.growth { left: 61.9%; top: 49.9%; width: 5.7%; height: 7.5%; transform: translate(-50%, -50%) rotate(8deg); }
.hero-copy { top: auto; bottom: 104px; width: 92%; z-index: 7; }
.interaction-hint { font-size: 12px; font-weight: 400; letter-spacing: .15em; color: #5c6355; margin: 0 0 20px; }
.project-nav { display: flex; justify-content: center; gap: 28px; }
.project-nav button { border: 0; border-bottom: 1px solid transparent; padding: 8px 0; background: none; font-size: 12px; letter-spacing: .06em; cursor: pointer; color: #626b59; min-height: 36px; }
.project-nav button:hover, .project-nav button[aria-pressed="true"] { border-color: var(--project-accent); color: #383b33; }
.project-detail { position: relative; z-index: 7; width: 32%; margin: 150px 5% 180px auto; max-width: 450px; min-height: 400px; }
.close-detail { border: 0; background: transparent; padding: 8px 0; font-size: 12px; color: #606958; cursor: pointer; margin: 0 0 40px; }
kbd { font-family: inherit; font-size: 9px; margin-left: 12px; opacity: .6; border: 1px solid #92978150; padding: 2px 4px; border-radius: 3px; }
.detail-copy { position: relative; padding-left: 27px; border-left: 1px solid #78826940; animation: text-in 500ms ease both; }
.detail-copy::before { content: ''; position: absolute; width: 7px; height: 7px; border-radius: 50%; left: -4px; top: 6px; background: var(--project-accent); box-shadow: 0 0 15px #d8bd7233; }
.detail-meta { display: flex; gap: 22px; font-size: 10px; letter-spacing: .12em; color: #626d59; margin: 0 0 20px; }
.project-detail h1 { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: clamp(25px, 2.8vw, 42px); font-weight: 500; line-height: 1.45; letter-spacing: -.02em; white-space: normal; text-shadow: none; margin: 0 0 12px; }
.detail-category { font-size: 12px; color: var(--project-accent); margin: 0 0 26px; }
.detail-description { font-size: 14px; line-height: 1.9; color: #454e3e; margin: 0 0 18px; }
.detail-pending { font-size: 12px; line-height: 1.9; color: #626c57; margin: 0 0 24px; }
.experience-pending { display: flex; justify-content: space-between; border-top: 1px solid #78826933; padding-top: 16px; font-size: 11px; color: #626c57; }
.page::before { content: ''; position: absolute; z-index: 3; pointer-events: none; inset: 94px 0 0; background: linear-gradient(90deg, transparent 35%, #f4efe570 53%, var(--page-bg) 65%); opacity: 0; transition: opacity 700ms; }
.is-detail::before { opacity: 1; }
.is-detail .ambient { opacity: .48; }
.ambient { transition: opacity 700ms; }
.is-detail .side-label, .is-detail .interaction-hint { visibility: hidden; }
.is-detail .hero-copy { width: 55%; left: 28%; }
.eye-toggle { font-size: 10px; letter-spacing: .06em; background: none; border: 1px solid #aeb39c44; padding: 9px 12px; border-radius: 20px; cursor: pointer; }
.eye-toggle:hover { border-color: #aeb39c; }
.eye-toggle:disabled { opacity: .5; cursor: default; }
@keyframes text-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 1000px) and (min-width: 761px) {
  .project-detail { width: 35%; margin-right: 3%; }
  .detail-copy { padding-left: 20px; }
  .project-nav { gap: 18px; }
}
@media (max-width: 760px) {
  :root { --portrait-size: min(108vw, 590px); --portrait-top: 132px; }
  .page { min-height: max(740px, 100svh, calc(var(--portrait-top) + var(--portrait-size) + 145px)); }
  .site-header { height: 80px; margin: 0 6%; }
  .header-note { display: none; }
  nav { position: static; transform: none; gap: 23px; }
  .hero-copy { top: auto; bottom: 105px; }
  .project-nav { gap: 6px 12px; flex-wrap: wrap; }
  .project-nav button { font-size: 11px; min-height: 44px; }
  .is-detail .portrait-scene { clip-path: inset(-150px -100vw calc(100% - 330px) -100vw); }
  .project-detail { width: auto; max-width: none; margin: 360px 7% 185px; min-height: 0; }
  .close-detail { margin-bottom: 27px; }
  .project-detail h1 { font-size: 27px; }
  .detail-copy { padding-left: 22px; }
  .is-detail .hero-copy { width: 92%; left: 50%; bottom: 92px; }
  .is-detail::before { background: linear-gradient(transparent 280px, var(--page-bg) 385px); }
  .is-detail .interaction-hint { display: none; }
  .site-footer { left: 6%; right: 6%; bottom: 22px; }
  .preview-label { position: static; transform: none; font-size: 9px; }
  .eye-toggle { font-size: 9px; padding: 9px 8px; }
  .page-index { gap: 8px; font-size: 9px; }
  .footer-rule { width: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .eye-toggle { display: none; }
}

/* Stage 03: slow resin movement, independent parallax, resource-driven reveal. */
.portrait-float { width: 100%; height: 100%; transform: translate3d(var(--parallax-face-x,0px),var(--parallax-face-y,0px),0); }
.is-detail .portrait-float { transform: none; }
.resin { translate: var(--parallax-bg-x,0px) var(--parallax-bg-y,0px); animation: resin-breathe 19s ease-in-out infinite alternate; }
.resin-sage { animation-name: sage-breathe; animation-duration: 23s; animation-delay: -7s; }
.resin::before, .resin::after { content: ''; position: absolute; pointer-events: none; inset: 0; border-radius: inherit; }
.resin::before { background: radial-gradient(ellipse at 24% 15%,#e2cea926,transparent 38%),radial-gradient(ellipse at 80% 80%,#a5b39320,transparent 48%); box-shadow: inset 2px 3px 5px #ecdbb82b,inset -9px -13px 24px #151a2252; animation: resin-light 14s ease-in-out infinite alternate; }
.resin::after { inset: 7px; border-top: 1px solid #e7d6aa20; border-left: 1px solid #f0ddb80d; }
.orbit,.spark,.tiny-dot { translate: var(--parallax-mark-x,0px) var(--parallax-mark-y,0px); }
.spark { animation: quiet-spark 11s ease-in-out infinite alternate; }
.spark-two { animation-delay: -5s; }
.is-detail .resin,.is-detail .resin::before,.is-detail .spark { animation-play-state: paused; }
.cursor-glow { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: radial-gradient(210px circle at var(--pointer-x,50%) var(--pointer-y,50%),#b0af7830,transparent 75%); transition: opacity 500ms; }
.has-pointer .cursor-glow { opacity: .45; }
.is-detail .cursor-glow { opacity: .13; }
.motion-controls { display: flex; align-items: center; gap: 14px; }
.replay-reveal { background: none; border: 0; padding: 9px 0; color: #626c57; font-size: 10px; letter-spacing: .06em; cursor: pointer; }
.replay-reveal:hover { color: #78582e; }
.reveal-veil { display: none; position: fixed; inset: 0; z-index: 100; background: #f4efe5; overscroll-behavior: none; touch-action: none; }
html.is-booting { overflow: hidden; }
.is-booting .reveal-veil:not([hidden]) { display: block; }
.reveal-veil.canvas-ready { background: transparent; }
.reveal-canvas { display: block; width: 100%; height: 100%; }
.reveal-controls { position: absolute; left: 50%; bottom: max(40px,env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 26px; align-items: center; white-space: nowrap; padding: 12px 20px; border-radius: 40px; background: #fffaf1ed; color: #454e3e; }
.reveal-message { margin: 0; font-size: 11px; letter-spacing: .1em; }
.skip-reveal { background: none; border: 0; border-bottom: 1px solid #858a7070; color: #775529; font-size: 11px; padding: 8px 0; cursor: pointer; }
.asset-notice { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 12; max-width: 90%; padding: 12px 18px; border: 1px solid #868f7266; border-radius: 8px; background: #f4efe5f0; font-size: 12px; line-height: 1.8; }
.retry-portrait { border: 0; background: none; padding: 4px 8px; color: #775529; cursor: pointer; text-decoration: underline; }
.portrait-failed .portrait,.portrait-failed .sticker-art,.portrait-failed .eye-layer,.portrait-failed .sticker-hotspots { visibility: hidden; }
.tab-hidden .resin,.tab-hidden .resin::before,.tab-hidden .spark { animation-play-state: paused; }
@keyframes resin-breathe {
  0% { border-radius: 43% 57% 63% 37% / 52% 49% 51% 48%; scale: 1 1; rotate: -2deg; }
  45% { border-radius: 51% 49% 52% 48% / 43% 57% 43% 57%; scale: 1.035 .965; rotate: 1deg; }
  100% { border-radius: 57% 43% 39% 61% / 58% 43% 57% 42%; scale: .98 1.035; rotate: 3deg; }
}
@keyframes sage-breathe {
  from { border-radius: 61% 39% 48% 52% / 40% 48% 52% 60%; scale: 1.025 .98; rotate: 2deg; }
  to { border-radius: 44% 56% 60% 40% / 57% 40% 60% 43%; scale: .98 1.03; rotate: -3deg; }
}
@keyframes resin-light { from { opacity: .45; } to { opacity: .95; } }
@keyframes quiet-spark { from { opacity: .45; scale: .94; } to { opacity: .8; scale: 1.04; } }
@media (max-width: 760px) {
  .motion-controls { gap: 12px; }
  .preview-label { display: none; }
  .reveal-controls { gap: 18px; padding: 10px 16px; bottom: 30px; }
  .reveal-message { font-size: 10px; letter-spacing: .02em; }
  .asset-notice { top: 85px; width: 90%; }
}
@media (hover: none), (pointer: coarse) {
  .cursor-glow { display: none; }
  .resin { animation-duration: 28s; }
  .spark { animation: none; }
}
@media (prefers-reduced-motion: reduce) {
  .portrait-float { transform: none !important; }
  .resin,.orbit,.spark,.tiny-dot { translate: none; animation: none !important; }
  .resin::before { animation: none !important; }
  .cursor-glow,.replay-reveal { display: none; }
}

/* Revised autonomous, layered wave field. The pointer never changes the backdrop. */
.audio-water { position: absolute; left: 50%; top: calc(var(--portrait-top) - var(--portrait-size) * .16); width: calc(var(--portrait-size) * 1.55); height: auto; transform: translateX(-50%); overflow: visible; }
.water-shell { stroke-linejoin: round; }
.water-line { fill: none; stroke-linejoin: round; }
.atmosphere-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: .95; }
.orbit { translate: none; opacity: .10; }
.spark,.tiny-dot,.cursor-glow { display: none; }
.is-detail .audio-water { opacity: .7; }
@media (max-width: 760px) {
  .audio-water { width: calc(var(--portrait-size) * 1.45); top: calc(var(--portrait-top) - var(--portrait-size) * .12); }
  .reveal-controls { max-width: 94vw; }
  .reveal-message { white-space: normal; max-width: 205px; line-height: 1.7; }

  <script>
(() => {
  const page = document.querySelector('.page');
  const scene = document.querySelector('.portrait-scene');
  const rig = document.querySelector('.portrait-rig');
  const panel = document.querySelector('.project-detail');
  const close = document.querySelector('.close-detail');
  const choice = document.querySelector('.game-choice');
  const detailCopy = document.querySelector('.detail-copy');
  const backToChoice = document.querySelector('.back-to-choice');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const mobile = matchMedia('(max-width: 760px)');
  const fine = matchMedia('(hover: hover) and (pointer: fine)');
  const eyeToggle = document.querySelector('.eye-toggle');
  const eyeLayer = document.querySelector('.eye-layer');
  const irises = [...document.querySelectorAll('[data-iris]')];
  let selected = null, trigger = null, frame = 0, motionUntil = 0;
  let pointer = null, gazeEnabled = !reduced.matches, eyeReady = false;
  let current = { x: 0, y: 0, amount: 0 };
  function updateZoom() {
    motionUntil = performance.now() + 900;
    if (!selected) { rig.style.transform = ''; wakeEyes(); return; }
    const rect = scene.getBoundingClientRect(), p = projects[selected];
    const z = HomeGeometry.zoom({ width: page.clientWidth, height: innerHeight, left: rect.left, top: rect.top + scrollY, size: rect.width, x: p.x, y: p.y, mobile: mobile.matches, reduced: reduced.matches });
    rig.style.transform = `translate(${z.dx}px, ${z.dy}px) scale(${z.scale})`;
    wakeEyes();
  }
  function selectProject(key, source) {
    const p = projects[key];
    if (!p) return;
    if (!selected) trigger = source;
    selected = key;
    choice.hidden = true;
    detailCopy.hidden = false;
    backToChoice.hidden = key !== 'novel' && key !== 'game';
    panel.setAttribute('aria-labelledby', 'detail-title');
    for (const field of ['index', 'title', 'category', 'date', 'description', 'pending']) panel.querySelector(`[data-field="${field}"]`).textContent = p[field];
    const experience = panel.querySelector('.experience-link');
    experience.hidden = !p.href;
    if (p.href) { experience.href = p.href; experience.textContent = p.cta || '体验报表工具 ↗'; }
    panel.querySelector('.experience-pending').hidden = Boolean(p.href);
    page.style.setProperty('--project-accent', p.color);
    panel.hidden = false;
    page.classList.add('is-detail');
    globalThis.HomeEffects?.setDetail(true);
    document.querySelectorAll('[data-project]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.project === (key === 'novel' ? 'game' : key))));
    updateZoom();
    if (p.showPreview === false) globalThis.HomeShowcase?.close();
    else globalThis.HomeShowcase?.select(key, source);
    close.focus({ preventScroll: true });
    if (mobile.matches) panel.scrollIntoView({ behavior: reduced.matches ? 'instant' : 'smooth', block: 'nearest' });
  }
  function showGameChoice(source) {
    if (!selected) trigger = source;
    selected = 'game';
    globalThis.HomeShowcase?.close();
    detailCopy.hidden = true;
    choice.hidden = false;
    panel.setAttribute('aria-labelledby', 'choice-title');
    page.style.setProperty('--project-accent', projects.game.color);
    panel.hidden = false;
    page.classList.add('is-detail');
    globalThis.HomeEffects?.setDetail(true);
    document.querySelectorAll('[data-project]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.project === 'game')));
    updateZoom();
    document.querySelector('#choice-title').focus({ preventScroll: true });
    if (mobile.matches) panel.scrollIntoView({ behavior: reduced.matches ? 'instant' : 'smooth', block: 'nearest' });
  }
  function goHome(event) {
    if (event) event.preventDefault();
    if (!selected) return;
    selected = null;
    globalThis.HomeShowcase?.close();
    page.classList.remove('is-detail');
    globalThis.HomeEffects?.setDetail(false);
    panel.hidden = true;
    updateZoom();
    document.querySelectorAll('[data-project]').forEach(button => button.setAttribute('aria-pressed', 'false'));
    if (trigger) trigger.focus({ preventScroll: true });
    trigger = null;
    scrollTo({ top: 0, behavior: reduced.matches ? 'instant' : 'smooth' });
  }
  document.querySelectorAll('[data-project]').forEach(button => button.addEventListener('click', () => {
    trigger = button;
    if (button.dataset.project === 'game') showGameChoice(button);
    else selectProject(button.dataset.project, button);
  }));
  document.querySelectorAll('[data-game-choice]').forEach(button => button.addEventListener('click', () => selectProject(button.dataset.gameChoice, trigger)));
  backToChoice.addEventListener('click', () => showGameChoice(trigger));
  close.addEventListener('click', goHome);
  document.querySelectorAll('[data-home]').forEach(link => link.addEventListener('click', goHome));
  document.addEventListener('keydown', event => { if (event.key === 'Escape') goHome(event); });
  addEventListener('resize', updateZoom);
  function syncEyeButton() {
    if (!eyeToggle) return;
    eyeToggle.setAttribute('aria-pressed', String(gazeEnabled));
    eyeToggle.textContent = gazeEnabled ? '眼神跟随 · 开' : '眼神跟随 · 关';
  }
  function animateEyes() {
    frame = 0;
    if (document.hidden) return;
    const active = eyeReady && gazeEnabled && fine.matches && !reduced.matches && pointer;
    const target = active ? HomeGeometry.gaze(pointer.x, pointer.y, rig.getBoundingClientRect()) : { x: 0, y: 0 };
    current.x += (target.x - current.x) * .18;
    current.y += (target.y - current.y) * .18;
    current.amount += ((active ? 1 : 0) - current.amount) * .18;
    irises[0].setAttribute('transform', `translate(${(-19 + current.x) * current.amount} ${(4 + current.y) * current.amount})`);
    irises[1].setAttribute('transform', `translate(${(-6 + current.x) * current.amount} ${(4 + current.y) * current.amount})`);
    eyeLayer.classList.toggle('is-tracking', current.amount > .01);
    const unsettled = Math.abs(target.x - current.x) + Math.abs(target.y - current.y) > .03 || Math.abs((active ? 1 : 0) - current.amount) > .005;
    if (unsettled || (active && performance.now() < motionUntil)) frame = requestAnimationFrame(animateEyes);
  }
  function wakeEyes() { if (!frame && !document.hidden) frame = requestAnimationFrame(animateEyes); }
  function resetEyes() { pointer = null; wakeEyes(); }
  document.addEventListener('pointermove', event => {
    if (event.pointerType !== 'mouse' || !gazeEnabled || reduced.matches || !fine.matches) return;
    pointer = { x: event.clientX, y: event.clientY }; wakeEyes();
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', resetEyes);
  addEventListener('blur', resetEyes);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frame); frame = 0; pointer = null; eyeLayer.classList.remove('is-tracking'); }
    else wakeEyes();
  });
  eyeToggle?.addEventListener('click', () => { gazeEnabled = !gazeEnabled; syncEyeButton(); wakeEyes(); });
  reduced.addEventListener('change', () => { gazeEnabled = !reduced.matches; syncEyeButton(); resetEyes(); updateZoom(); });
  fine.addEventListener('change', resetEyes);
  const eyeAsset = new Image();
  eyeAsset.onload = () => { eyeReady = true; wakeEyes(); };
  eyeAsset.onerror = () => { if (eyeToggle) { eyeToggle.disabled = true; eyeToggle.textContent = '眼神素材未加载'; } };
  eyeAsset.src = document.querySelector('#sclera-image').getAttribute('href');
  syncEyeButton();
  globalThis.HomeEffects?.bootReady();
})();

</script>
